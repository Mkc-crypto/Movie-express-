<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Express - Discover Trending Movies & Trailers</title>
  <meta name="description" content="Watch trending movie trailers, discover new films, and explore top anime on Movie Express.">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🎬 Movie Express</h1>

<input type="text" id="searchInput" placeholder="Search movies...">
<button id="notifyBtn">Enable Movie Notifications</button>

<div class="filters">
  <button onclick="filterMovies('all')">All</button>
  <button onclick="filterMovies('action')">Action</button>
  <button onclick="filterMovies('comedy')">Comedy</button>
  <button onclick="filterMovies('anime')">Anime</button>
</div>

<div class="movies"></div>

<script src="script.js"></script>
</body>
</html>
