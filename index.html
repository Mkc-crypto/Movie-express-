<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Mobile Responsive Scaling (DO NOT REMOVE) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Title -->
    <title>Movie Express - Watch Trending Movies & Trailers</title>

    <!-- SEO Description -->
    <meta name="description" content="Discover trending movies, anime, and watch official trailers on Movie Express. Updated daily.">

    <!-- Author -->
    <meta name="author" content="Movie Express">

    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1 class="logo">🎬 Movie Express</h1>
    </header>

    <!-- Search Section -->
    <section class="search-section">
        <input type="text" id="searchInput" placeholder="Search for a movie...">
    </section>

    <!-- Movies Container -->
    <section class="movies-container">

        <!-- Movie Card 1 -->
        <div class="movie-card">
            <img src="https://via.placeholder.com/300x450" alt="Naruto">
            <h3>Naruto</h3>
            <a href="https://www.youtube.com/results?search_query=Naruto+trailer" target="_blank">
                <button>Watch Trailer</button>
            </a>
        </div>

        <!-- Movie Card 2 -->
        <div class="movie-card">
            <img src="https://via.placeholder.com/300x450" alt="Batman">
            <h3>Batman</h3>
            <a href="https://www.youtube.com/results?search_query=Batman+trailer" target="_blank">
                <button>Watch Trailer</button>
            </a>
        </div>

        <!-- Movie Card 3 -->
        <div class="movie-card">
            <img src="https://via.placeholder.com/300x450" alt="Avengers">
            <h3>Avengers</h3>
            <a href="https://www.youtube.com/results?search_query=Avengers+trailer" target="_blank">
                <button>Watch Trailer</button>
            </a>
        </div>

        <!-- Movie Card 4 -->
        <div class="movie-card">
            <img src="https://via.placeholder.com/300x450" alt="One Piece">
            <h3>One Piece</h3>
            <a href="https://www.youtube.com/results?search_query=One+Piece+trailer" target="_blank">
                <button>Watch Trailer</button>
            </a>
        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Movie Express. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
