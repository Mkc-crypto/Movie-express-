<!DOCTYPE html>
<html lang="en">
<head>

  <!-- BASIC META -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO TITLE (Very Important) -->
  <title>Movie Express | Watch Movie Trailers & Discover Action, Comedy & Anime</title>

  <!-- META DESCRIPTION (Google shows this) -->
  <meta name="description" content="Watch the latest movie trailers online. Discover action, comedy, and anime movies on Movie Express. Simple, fast, and free movie browsing.">

  <!-- KEYWORDS (Optional but helpful) -->
  <meta name="keywords" content="watch movies, movie trailers, action movies, comedy movies, anime movies, free movie website">

  <!-- AUTHOR -->
  <meta name="author" content="Movie Express">

  <!-- OPEN GRAPH (For Facebook & Social Sharing) -->
  <meta property="og:title" content="Movie Express - Watch Movie Trailers Online">
  <meta property="og:description" content="Discover and watch action, comedy, and anime movie trailers.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="banner.jpg">
  <meta property="og:url" content="https://yourdomain.com">

  <!-- TWITTER CARD -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Movie Express - Watch Movie Trailers">
  <meta name="twitter:description" content="Discover the latest action, comedy and anime movies.">
  <meta name="twitter:image" content="banner.jpg">

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>🎬 Movie Express</h1>

<!-- SEARCH BAR -->
<input type="text" id="searchInput" placeholder="Search movies...">
<button id="notifyBtn">Enable Movie Notifications</button>

<!-- CATEGORY FILTERS -->
<div class="filters">
  <button onclick="filterMovies('all')">All</button>
  <button onclick="filterMovies('action')">Action</button>
  <button onclick="filterMovies('comedy')">Comedy</button>
  <button onclick="filterMovies('anime')">Anime</button>
</div>
<!-- MOVIE GRID -->
<div class="movies"></div>
</div>
<script src="script.js"></script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Movie Express",
  "url": "https://mkc-crypto.github.io/Movie-express-/",
  "description": "Watch movie trailers online including action, comedy and anime movies."
}
</script>
</body>
</html>
